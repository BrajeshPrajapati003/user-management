spring:

  ansi:
    output:
      enabled: always

  config:
    import: optional:file:.env[.properties]

  application:
    name: usermgmt

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/usermgmt_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:usermgmt}
    password: ${SPRING_DATASOURCE_PASSWORD:secret@pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
